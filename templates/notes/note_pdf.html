<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>{{ note.title }}</title>
<style>
  /* 注意：xhtml2pdf 只支持简单 CSS，不能用 flex/grid/Bootstrap */
  @font-face {
    /* 系统中唯一的纯 .ttf 中文字体；路径必须用正斜杠 */
    font-family: 'SimHei';
    src: url('C:/Windows/Fonts/simhei.ttf');
  }
  body { font-family: 'SimHei'; font-size: 12pt; color: #333; }
  h1 { font-size: 20pt; margin-bottom: 6pt; }
  h2 { font-size: 16pt; }
  h3 { font-size: 14pt; }
  .meta { color: #888; font-size: 10pt; margin-bottom: 16pt; }
  pre { background: #f5f5f5; padding: 8pt; font-size: 10pt; }
  code { font-size: 10pt; }
  table { border-collapse: collapse; }
  td, th { border: 1pt solid #ccc; padding: 4pt 8pt; }
  img { max-width: 100%; }
  hr { border: none; border-top: 1pt solid #ddd; }
</style>
</head>
<body>
<h1>{{ note.title }}</h1>
<p class="meta">{{ note.author.username }} · {{ note.updated_at|date:"Y-m-d H:i" }} · 浏览量 {{ note.view_count }}</p>
{{ html_content|safe }}
</body>
</html>
