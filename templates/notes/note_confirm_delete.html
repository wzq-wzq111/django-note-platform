{% extends 'base.html' %}
{% block title %}删除笔记{% endblock %}
{% block content %}
<div class="text-center centered-page">
  <h3>确定删除「{{ note.title }}」？</h3>
  <p class="text-muted">此操作不可恢复</p>
  <form method="post">
    {% csrf_token %}
    <button class="btn btn-danger">确认删除</button>
    <a href="{% url 'note_detail' note.pk %}" class="btn btn-outline-secondary">取消</a>
  </form>
</div>
{% endblock %}
